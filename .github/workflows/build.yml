name: Build VST3
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2022
            flags: '-G "Visual Studio 17 2022" -A x64'
            experimental: false
          - platform: macos-universal
            runner: macos-15
            flags: '-DCMAKE_OSX_ARCHITECTURES=arm64\;x86_64 -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0'
            experimental: false
          - platform: linux-x86_64
            runner: ubuntu-24.04
            flags: ''
            experimental: true
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfreetype-dev libfontconfig1-dev libgl1-mesa-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev
      - name: Read package version
        id: project
        run: cmake -P cmake/Version.cmake
      - name: Configure
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.flags }}
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Run processor smoke test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Verify macOS architectures
        if: runner.os == 'macOS'
        run: lipo -verify_arch arm64 x86_64 "build/RealtimeMIDI_artefacts/Release/VST3/Realtime MIDI.vst3/Contents/MacOS/Realtime MIDI"
      - name: Package complete VST3 bundle
        shell: bash
        working-directory: build/RealtimeMIDI_artefacts/Release/VST3
        run: cmake -E tar cf "${{ github.workspace }}/Realtime-MIDI-${{ steps.project.outputs.version }}-${{ matrix.platform }}.zip" --format=zip -- "Realtime MIDI.vst3"
      - uses: actions/upload-artifact@v4
        with:
          name: Realtime-MIDI-${{ steps.project.outputs.version }}-${{ matrix.platform }}
          path: Realtime-MIDI-${{ steps.project.outputs.version }}-${{ matrix.platform }}.zip
          if-no-files-found: error
          compression-level: 0
